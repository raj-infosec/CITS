<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="340" height="84" fill="none">
  <defs>
    <linearGradient id="citsOrbGrad1" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#0072CE" />
      <stop offset="60%" stop-color="#004B87" />
      <stop offset="100%" stop-color="#002855" />
    </linearGradient>
    <linearGradient id="citsOrbGrad2" x1="8%" y1="85%" x2="92%" y2="15%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="50%" stop-color="#0077C8" />
      <stop offset="100%" stop-color="#005A9C" />
    </linearGradient>
    <linearGradient id="citsOrbGrad3" x1="0%" y1="40%" x2="100%" y2="60%">
